<!doctype html>
<html lang="ja" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/china-import-tool/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 中身は日本語なのに lang="en" だったため、ブラウザが「英語のページ」と判断して
         自動翻訳をかけていた。翻訳はテキストノードを差し替えるので、Reactが管理している
         DOMと食い違い、再描画時に removeChild が失敗して画面が真っ白になっていた。
         lang を ja に直したうえで、翻訳自体も明示的に止める。 -->
    <meta name="google" content="notranslate" />
    <title>中国輸入管理</title>
    <!-- build: 2026-07-06.2 -->

    <script>
      (function() {
        var p = new URLSearchParams(window.location.search).get('p');

        // 共有ページのURLは相手に渡すものなので、# を付けずに書きたい。
        // ただしHashRouterはハッシュしか見ないので、パスで来たら
        // ハッシュへ振り替える。
        // 404.htmlを経由すると ?p=/keep-public?share=... の形で来るので、
        // pathname ではなく p の中身を見る（このときpathnameはまだ '/'）
        var target = p || (window.location.pathname.replace('/china-import-tool', '')
                           + window.location.search);
        if (target.indexOf('/keep-public') === 0 && !window.location.hash) {
          window.location.replace('/china-import-tool/#' + target);
          return;
        }

        if (p) {
          window.history.replaceState(null, null, '/china-import-tool' + p);
        }
      })();
    </script>
    <script type="module" crossorigin src="/china-import-tool/assets/index-BRN4FRN0.js"></script>
    <link rel="stylesheet" crossorigin href="/china-import-tool/assets/index-BvuTldty.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
