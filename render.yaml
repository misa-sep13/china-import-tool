services:
  - type: web
    name: china-import-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: china-import-db
          property: connectionString

databases:
  - name: china-import-db
    databaseName: china_import
    user: china_import
