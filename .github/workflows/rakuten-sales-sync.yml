name: Daily Rakuten Sales Sync

on:
  schedule:
    # 毎日 18:00 UTC（= JST 3:00）
    - cron: '0 18 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install httpx
      - name: 楽天売上を同期（重い受注取得はこのランナーで実行）
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: python scripts/sync_rakuten_sales.py
