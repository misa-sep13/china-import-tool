name: Warm SP-API Cache

on:
  schedule:
    # 毎時50分に1回。売上キャッシュのTTL(70分)が切れる前に温め直し、
    # ユーザーが画面を開いた時には常にキャッシュ済み＝即表示になるようにする。
    # （頻度を上げすぎるとSP-API取得のメモリスパイクが増えるため毎時1回に抑える）
    - cron: '50 * * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SP-API fetch to refresh cache
        run: |
          # force=true でキャッシュを取り直す。preview と stock は
          # 同じ在庫・売上キャッシュを共有するため、preview を温めれば両方カバーできる。
          curl -X POST "${{ secrets.BACKEND_URL }}/api/orders/preview/start?force=true" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.AUTH_SERVICE_TOKEN }}" \
            --max-time 60 \
            --retry 2 \
            -f
      - name: Wait for order fetch to finish
        run: |
          # orderMetricsのレート制限枠(約0.5回/秒)を発注管理の取得と奪い合わないよう、
          # 発注管理側が終わる時間を待ってから商品分析を温める
          sleep 240
      - name: Warm analytics cache
        run: |
          # 商品分析(30日)のデータも温める。30日売上詳細・新商品判定・広告・カタログが
          # キャッシュされ、画面を開いたときに即表示になる（コールドだと10分以上かかる）。
          # forceなし＝期限切れの分だけ取得するので、温まっていれば何もしない。
          curl -X POST "${{ secrets.BACKEND_URL }}/api/analytics/start?days=30" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.AUTH_SERVICE_TOKEN }}" \
            --max-time 60 \
            --retry 2 \
            -f
