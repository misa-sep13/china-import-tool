name: Month-end Inventory Snapshot

on:
  schedule:
    # 毎月28〜31日の 14:59 UTC（= JST 23:59）に起動し、
    # スクリプト側で「その日が月末か」を判定して最終日だけ確定する
    - cron: '59 14 28-31 * *'
  workflow_dispatch:
    inputs:
      period:
        description: '対象月（YYYY-MM）。空なら実行日の月'
        required: false
        default: ''
      platforms:
        description: '対象（rakuten,amazon）'
        required: false
        default: 'rakuten'
      force:
        description: '月末でなくても実行する'
        required: false
        default: 'false'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install httpx
      - name: 月末在庫を確定
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          AUTH_SERVICE_TOKEN: ${{ secrets.AUTH_SERVICE_TOKEN }}
          PERIOD: ${{ github.event.inputs.period }}
          # Amazonアカウント停止中のためSP-APIが403を返し続ける。amazonを含めると
          # 楽天の確定に成功しても毎月末にジョブが失敗扱いになるので、定期実行は
          # 楽天のみにしている。アカウント復旧後に 'rakuten,amazon' へ戻すこと。
          PLATFORMS: ${{ github.event.inputs.platforms || 'rakuten' }}
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/capture_inventory_snapshot.py
