name: Daily SEO Ranking Check

# 楽天のAllowed IP設定がCIDR非対応で、Renderの共有IPはデプロイのたびに変わるため、
# GitHub Actions/Render経由の自動実行では継続的に機能しない。
# 実際のSEOチェックはローカルPCから scripts/check_seo_rankings_local.py を
# Windowsタスクスケジューラで実行する運用に切り替えた。
# このワークフローは楽天ウェブサービスAPI経由の動作確認用に手動実行のみ残す。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install httpx
      - name: SEO順位チェックをトリガー（実処理はRenderサーバー側/楽天ウェブサービスAPI経由）
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          AUTH_SERVICE_TOKEN: ${{ secrets.AUTH_SERVICE_TOKEN }}
        run: python scripts/check_seo_rankings.py
